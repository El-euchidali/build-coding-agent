<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coding Agent</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f7f6f3;
        --surface: #ffffff;
        --surface-hover: #f0efec;
        --border: #e8e6e1;
        --text: #1a1a1a;
        --text-secondary: #6b6560;
        --text-muted: #9b9590;
        --accent: #c67a3c;
        --accent-light: #fff3e8;
        --accent-dark: #a05e28;
        --green: #2d8659;
        --green-light: #e8f5ee;
        --red: #c03a2b;
        --red-light: #fdeceb;
        --blue: #2b6cb0;
        --blue-light: #ebf4ff;
        --purple: #6b46c1;
        --purple-light: #f3eeff;
        --teal: #0d7377;
        --teal-light: #e6fafa;
        --user-bg: #f0ede8;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
        --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.06);
        --radius: 12px;
        --radius-sm: 8px;
        --font: "DM Sans", -apple-system, sans-serif;
        --mono: "JetBrains Mono", "Fira Code", monospace;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ── Header ─────────────────────────────────────── */
      .header {
        border-bottom: 1px solid var(--border);
        padding: 12px 24px;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(12px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .logo-icon {
        width: 30px;
        height: 30px;
        background: var(--accent);
        border-radius: 7px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 15px;
        font-weight: 600;
        font-family: var(--mono);
      }

      .logo-text {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.3px;
      }
      .logo-badge {
        font-size: 10px;
        font-weight: 600;
        color: var(--accent);
        background: var(--accent-light);
        padding: 2px 8px;
        border-radius: 20px;
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .header-stat {
        font-size: 12px;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .header-stat .val {
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 600;
        color: var(--text-secondary);
      }

      .btn {
        font-size: 12px;
        color: var(--text-muted);
        background: none;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 5px 12px;
        cursor: pointer;
        font-family: var(--font);
        transition: all 0.15s;
      }
      .btn:hover {
        background: var(--surface-hover);
        color: var(--text);
      }
      .btn-stop {
        color: var(--red);
        border-color: #f3c6c0;
        background: var(--red-light);
        display: none;
      }
      .btn-stop:hover {
        background: var(--red);
        color: white;
        border-color: var(--red);
      }
      .btn-stop.show {
        display: inline-block;
      }

      /* ── Layout ─────────────────────────────────────── */
      .layout {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      /* ── Sidebar ────────────────────────────────────── */
      .sidebar {
        width: 240px;
        border-right: 1px solid var(--border);
        background: var(--surface);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        overflow: hidden;
      }

      .sidebar-header {
        padding: 12px 16px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text-muted);
        border-bottom: 1px solid var(--border);
      }

      .workspace-path {
        padding: 8px 16px;
        font-family: var(--mono);
        font-size: 10px;
        color: var(--text-muted);
        word-break: break-all;
        border-bottom: 1px solid var(--border);
      }

      .file-tree {
        flex: 1;
        overflow-y: auto;
        padding: 6px 0;
      }

      .file-item {
        padding: 3px 16px;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--text-secondary);
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: background 0.1s;
      }

      .file-item:hover {
        background: var(--surface-hover);
        color: var(--text);
      }
      .file-item.dir {
        color: var(--accent);
        font-weight: 500;
        cursor: default;
      }
      .file-item.active {
        background: var(--accent-light);
        color: var(--accent-dark);
      }
      .file-item.edited::after {
        content: "●";
        color: var(--accent);
        margin-left: 6px;
        font-size: 9px;
      }

      .file-count {
        padding: 8px 16px;
        font-size: 10px;
        color: var(--text-muted);
        border-top: 1px solid var(--border);
      }

      /* ── Conversation list ──────────────────────────── */
      .conv-list {
        max-height: 200px;
        overflow-y: auto;
        padding: 4px 0;
        border-bottom: 1px solid var(--border);
      }

      .conv-item {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 8px 8px 8px 16px;
        cursor: pointer;
        transition: background 0.1s;
        border-left: 3px solid transparent;
      }

      .conv-item:hover {
        background: var(--surface-hover);
      }

      .conv-item.active {
        background: var(--accent-light);
        border-left-color: var(--accent);
      }

      .conv-body {
        flex: 1;
        min-width: 0;
      }

      .conv-title {
        font-size: 12px;
        font-weight: 500;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .conv-time {
        font-size: 10px;
        color: var(--text-muted);
        margin-top: 2px;
      }

      .conv-delete {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text-muted);
        cursor: pointer;
        padding: 5px;
        border-radius: 4px;
        transition: opacity 0.1s, color 0.1s, background 0.1s, border-color 0.1s;
      }

      .conv-delete svg {
        width: 14px;
        height: 14px;
        display: block;
      }

      .conv-item:hover .conv-delete,
      .conv-item.active .conv-delete {
        opacity: 1;
      }

      .conv-delete:hover {
        color: var(--red);
        background: var(--red-light);
        border-color: #f3c6c0;
      }

      .btn-delete {
        color: var(--red);
        border-color: #f3c6c0;
      }

      .btn-delete:hover {
        background: var(--red-light);
        color: var(--red);
      }

      /* ── Chat Area ──────────────────────────────────── */
      .chat-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-width: 0;
      }

      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      /* ── Messages ───────────────────────────────────── */
      .message {
        max-width: 720px;
        animation: fadeIn 0.2s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message.user {
        align-self: flex-end;
      }

      .message.assistant {
        align-self: flex-start;
      }

      .msg-bubble {
        padding: 12px 16px;
        border-radius: 16px;
        font-size: 14px;
        line-height: 1.6;
        white-space: pre-wrap;
        word-wrap: break-word;
      }

      .message.user .msg-bubble {
        background: var(--accent);
        color: white;
        border-bottom-right-radius: 4px;
      }

      .message.assistant .msg-bubble {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        border-bottom-left-radius: 4px;
        box-shadow: var(--shadow-sm);
      }

      .msg-bubble code {
        font-family: var(--mono);
        font-size: 12px;
        background: rgba(0, 0, 0, 0.06);
        padding: 1px 5px;
        border-radius: 4px;
      }

      .message.user .msg-bubble code {
        background: rgba(255, 255, 255, 0.2);
      }

      .caret {
        display: inline-block;
        width: 7px;
        height: 14px;
        background: var(--accent);
        margin-left: 1px;
        vertical-align: text-bottom;
        animation: blink 1s step-end infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      /* ── Tool Call Cards ────────────────────────────── */
      .tool-card {
        max-width: 720px;
        align-self: flex-start;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        overflow: hidden;
        animation: fadeIn 0.2s ease;
        box-shadow: var(--shadow-sm);
      }

      .tool-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
        cursor: pointer;
        transition: background 0.1s;
      }

      .tool-header:hover {
        background: var(--surface-hover);
      }

      .tool-icon {
        width: 20px;
        height: 20px;
        background: var(--teal);
        border-radius: 5px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 10px;
        font-weight: 700;
        font-family: var(--mono);
        flex-shrink: 0;
      }

      .tool-name {
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 500;
        color: var(--text);
      }

      .tool-args {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--text-muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .tool-time {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--text-muted);
        margin-left: auto;
        flex-shrink: 0;
      }

      .tool-chevron {
        color: var(--text-muted);
        font-size: 12px;
        transition: transform 0.2s;
        flex-shrink: 0;
      }

      .tool-chevron.open {
        transform: rotate(90deg);
      }

      .tool-result {
        display: none;
        padding: 10px 14px;
        font-family: var(--mono);
        font-size: 11px;
        line-height: 1.5;
        color: var(--text-secondary);
        background: var(--surface);
        max-height: 200px;
        overflow-y: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .tool-result.show {
        display: block;
      }

      .tool-card.denied .tool-icon {
        background: var(--red);
      }
      .tool-card.denied .tool-header {
        background: var(--red-light);
        border-color: #f3c6c0;
      }

      /* ── Thinking ───────────────────────────────────── */
      .thinking-msg {
        max-width: 720px;
        align-self: flex-start;
        font-size: 13px;
        color: var(--text-muted);
        font-style: italic;
        padding: 4px 0;
        animation: fadeIn 0.2s ease;
      }

      /* ── Typing Indicator ───────────────────────────── */
      .typing {
        align-self: flex-start;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        border-bottom-left-radius: 4px;
        box-shadow: var(--shadow-sm);
        animation: fadeIn 0.2s ease;
      }

      .typing-dots {
        display: flex;
        gap: 4px;
      }

      .typing-dot {
        width: 6px;
        height: 6px;
        background: var(--accent);
        border-radius: 50%;
        animation: typingBounce 1.4s ease infinite;
      }

      .typing-dot:nth-child(2) {
        animation-delay: 0.15s;
      }
      .typing-dot:nth-child(3) {
        animation-delay: 0.3s;
      }

      @keyframes typingBounce {
        0%,
        80%,
        100% {
          transform: translateY(0);
          opacity: 0.4;
        }
        40% {
          transform: translateY(-6px);
          opacity: 1;
        }
      }

      /* ── Banners ────────────────────────────────────── */
      .rag-msg {
        align-self: center;
        font-size: 11px;
        color: var(--purple);
        background: var(--purple-light);
        padding: 4px 14px;
        border-radius: 20px;
        animation: fadeIn 0.2s ease;
      }
      .stopped-msg {
        align-self: center;
        font-size: 11px;
        color: var(--red);
        background: var(--red-light);
        padding: 4px 14px;
        border-radius: 20px;
        animation: fadeIn 0.2s ease;
      }

      /* ── Welcome ────────────────────────────────────── */
      .welcome {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: var(--text-muted);
      }

      .welcome-icon {
        font-size: 48px;
        font-family: var(--mono);
        opacity: 0.2;
      }

      .welcome-text {
        font-size: 15px;
        text-align: center;
        max-width: 400px;
        line-height: 1.6;
      }

      .welcome-suggestions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
        justify-content: center;
      }

      .suggestion {
        font-size: 12px;
        color: var(--accent);
        background: var(--accent-light);
        border: 1px solid #f0d5b8;
        padding: 6px 14px;
        border-radius: 20px;
        cursor: pointer;
        transition: all 0.15s;
        font-family: var(--font);
      }

      .suggestion:hover {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
      }

      /* ── Detail Panel ───────────────────────────────── */
      .detail-panel {
        width: 0;
        border-left: 1px solid var(--border);
        background: var(--surface);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        overflow: hidden;
        transition: width 0.2s ease;
      }
      .detail-panel.open {
        width: 460px;
      }
      .detail-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .detail-title {
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 500;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
      }
      .detail-tag {
        font-size: 10px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 20px;
        flex-shrink: 0;
      }
      .detail-tag.diff {
        color: var(--accent);
        background: var(--accent-light);
      }
      .detail-tag.file {
        color: var(--blue);
        background: var(--blue-light);
      }
      .detail-close {
        cursor: pointer;
        color: var(--text-muted);
        font-size: 16px;
        line-height: 1;
        border: none;
        background: none;
        padding: 2px 6px;
      }
      .detail-close:hover {
        color: var(--text);
      }
      .detail-body {
        flex: 1;
        overflow: auto;
        font-family: var(--mono);
        font-size: 11px;
        line-height: 1.6;
      }
      .code-line {
        display: flex;
        white-space: pre;
      }
      .code-line .ln {
        width: 42px;
        flex-shrink: 0;
        text-align: right;
        padding-right: 10px;
        color: var(--text-muted);
        user-select: none;
      }
      .code-line .lc {
        flex: 1;
        padding-right: 12px;
      }
      .code-line.add {
        background: var(--green-light);
      }
      .code-line.add .lc::before {
        content: "+ ";
        color: var(--green);
      }
      .code-line.del {
        background: var(--red-light);
      }
      .code-line.del .lc::before {
        content: "- ";
        color: var(--red);
      }
      .code-line.ctx .lc::before {
        content: "  ";
      }

      /* ── Input Bar ──────────────────────────────────── */
      .input-bar {
        padding: 16px 24px;
        border-top: 1px solid var(--border);
        background: var(--surface);
        flex-shrink: 0;
      }

      .input-wrapper {
        max-width: 720px;
        margin: 0 auto;
        display: flex;
        gap: 10px;
        align-items: flex-end;
      }

      .input-wrapper textarea {
        flex: 1;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 16px;
        font-family: var(--font);
        font-size: 14px;
        line-height: 1.5;
        color: var(--text);
        background: var(--bg);
        resize: none;
        outline: none;
        min-height: 42px;
        max-height: 150px;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      .input-wrapper textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-light);
      }
      .input-wrapper textarea:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .send-btn {
        width: 42px;
        height: 42px;
        border: none;
        border-radius: 12px;
        background: var(--accent);
        color: white;
        font-size: 18px;
        cursor: pointer;
        transition: all 0.15s;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .send-btn:hover {
        background: var(--accent-dark);
        transform: translateY(-1px);
      }
      .send-btn:active {
        transform: translateY(0);
      }
      .send-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        transform: none;
      }

      /* ── Responsive ─────────────────────────────────── */
      @media (max-width: 900px) {
        .sidebar {
          display: none;
        }
        .detail-panel.open {
          width: 300px;
        }
        .chat-messages {
          padding: 16px;
        }
        .input-bar {
          padding: 12px 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo">
        <div class="logo-icon">λ</div>
        <span class="logo-text">Coding Agent</span>
        <span class="logo-badge">FSM · RAG</span>
      </div>
      <div class="header-right">
        <div class="header-stat">
          Tokens <span class="val" id="tokens">0</span>
        </div>
        <button class="btn btn-stop" id="stop-btn" onclick="stopAgent()">
          ■ Stop
        </button>
        <button class="btn btn-delete" onclick="deleteCurrentChat()">
          Delete Chat
        </button>
        <button class="btn" onclick="resetChat()">New Chat</button>
      </div>
    </div>

    <div class="layout">
      <div class="sidebar">
        <div class="sidebar-header">Chats</div>
        <div class="conv-list" id="conv-list"></div>
        <div class="sidebar-header">Workspace</div>
        <div class="workspace-path" id="ws-path">Loading...</div>
        <div class="file-tree" id="file-tree"></div>
        <div class="file-count" id="file-count"></div>
      </div>

      <div class="chat-container">
        <div class="chat-messages" id="chat">
          <div class="welcome" id="welcome">
            <div class="welcome-icon">λ</div>
            <div class="welcome-text">
              I'm your coding agent. I can read, understand, edit, and test code
              in your workspace. Ask me anything.
            </div>
            <div class="welcome-suggestions">
              <div class="suggestion" onclick="useSuggestion(this)">
                Summarize this project
              </div>
              <div class="suggestion" onclick="useSuggestion(this)">
                What files are in this repo?
              </div>
              <div class="suggestion" onclick="useSuggestion(this)">
                Show me the main entry point
              </div>
              <div class="suggestion" onclick="useSuggestion(this)">
                Find all TODO comments
              </div>
            </div>
          </div>
        </div>

        <div class="input-bar">
          <div class="input-wrapper">
            <textarea
              id="user-input"
              placeholder="Ask me anything about your code..."
              rows="1"
              onkeydown="handleKey(event)"
              oninput="autoGrow(this)"
            ></textarea>
            <button class="send-btn" id="send-btn" onclick="sendMessage()">
              ↑
            </button>
          </div>
        </div>
      </div>

      <div class="detail-panel" id="detail-panel">
        <div class="detail-header">
          <span class="detail-tag file" id="detail-tag">FILE</span>
          <span class="detail-title" id="detail-title">file</span>
          <button class="detail-close" onclick="closeDetail()">×</button>
        </div>
        <div class="detail-body" id="detail-body"></div>
      </div>
    </div>

    <script>
      let workspace = "";
      let sending = false;
      let conversationId = null;
      const editedFiles = new Set();

      const WELCOME_HTML = `
        <div class="welcome" id="welcome">
          <div class="welcome-icon">λ</div>
          <div class="welcome-text">
            I'm your coding agent. I can read, understand, edit, and test code in your workspace. Ask me anything.
          </div>
          <div class="welcome-suggestions">
            <div class="suggestion" onclick="useSuggestion(this)">Summarize this project</div>
            <div class="suggestion" onclick="useSuggestion(this)">What files are in this repo?</div>
            <div class="suggestion" onclick="useSuggestion(this)">Show me the main entry point</div>
            <div class="suggestion" onclick="useSuggestion(this)">Find all TODO comments</div>
          </div>
        </div>`;

      // Tools that modify a single file (used to capture before/after diffs).
      const FILE_EDIT_TOOLS = new Set([
        "write_file",
        "str_replace",
        "insert_at_line",
        "delete_lines",
        "edit_and_verify",
      ]);

      function pathArg(args) {
        if (!args) return null;
        return (
          args.path ||
          args.file_path ||
          args.filename ||
          args.file ||
          null
        );
      }

      function sendMessage() {
        const input = document.getElementById("user-input");
        const msg = input.value.trim();
        if (!msg || sending) return;

        const welcome = document.getElementById("welcome");
        if (welcome) welcome.remove();

        addBubble("user", msg);
        input.value = "";
        input.style.height = "42px";

        sending = true;
        document.getElementById("send-btn").disabled = true;
        document.getElementById("stop-btn").classList.add("show");

        showTyping();

        fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: msg,
            workspace: workspace,
            conversation_id: conversationId,
          }),
        })
          .then((response) => {
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";

            function read() {
              reader.read().then(({ done, value }) => {
                if (done) {
                  finishSend();
                  return;
                }
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split("\n");
                buffer = lines.pop();
                for (const line of lines) {
                  if (line.startsWith("data: ")) {
                    try {
                      handleEvent(JSON.parse(line.slice(6)));
                    } catch (e) {
                      console.error(e);
                    }
                  }
                }
                read();
              });
            }
            read();
          })
          .catch((err) => {
            console.error(err);
            removeTyping();
            const errMsg = document.createElement("div");
            errMsg.className = "message assistant";
            errMsg.innerHTML = `<div class="msg-bubble" style="border-color:var(--red);background:var(--red-light);color:var(--red);">
              Connection error: ${escapeHtml(err.message || "Request failed")}. Try sending your message again.
            </div>`;
            document.getElementById("chat").appendChild(errMsg);
            finishSend();
          });
      }

      function handleEvent(data) {
        const chat = document.getElementById("chat");

        if (data.type === "error") {
          removeTyping();
          const errMsg = document.createElement("div");
          errMsg.className = "message assistant";
          errMsg.innerHTML = `<div class="msg-bubble" style="border-color:var(--red);background:var(--red-light);color:var(--red);">
            ${escapeHtml(data.message || "An error occurred")}
          </div>`;
          chat.appendChild(errMsg);
          finishSend();
          return;
        }

        if (data.type === "rag") {
          removeTyping();
          const el = document.createElement("div");
          el.className = "rag-msg";
          el.textContent = "◆ " + data.info;
          chat.appendChild(el);
          showTyping();
          scrollBottom();
          return;
        }

        if (data.type === "stopped") {
          removeTyping();
          const el = document.createElement("div");
          el.className = "stopped-msg";
          el.textContent = "■ Stopped by you";
          chat.appendChild(el);
          finishSend();
          return;
        }

        if (data.type === "tool_call") {
          removeTyping();
          addToolCard(data);
          updateTokens(data.tokens);
          if (!data.denied) handlePostEdit(data);
          showTyping();
          scrollBottom();
          return;
        }

        if (data.type === "thinking") {
          removeTyping();
          const el = document.createElement("div");
          el.className = "thinking-msg";
          el.textContent = data.content;
          chat.appendChild(el);
          showTyping();
          scrollBottom();
          return;
        }

        if (data.type === "response") {
          removeTyping();
          streamBubble(data.content);
          updateTokens(data.tokens);
          finishSend();
          return;
        }
      }

      // ── Diff / file viewer ───────────────────────────
      function handlePostEdit(data) {
        const p = pathArg(data.args);
        if (!p || !FILE_EDIT_TOOLS.has(data.tool)) return;
        editedFiles.add(p);
        markEdited(p);
        fetchFile(p)
          .then((res) => {
            const after = res && res.content != null ? res.content : "";
            showFile(p, after);
          })
          .catch(() => {});
      }

      function fetchFile(path) {
        const url =
          "/api/file?path=" +
          encodeURIComponent(path) +
          "&workspace=" +
          encodeURIComponent(workspace);
        return fetch(url).then((r) => (r.ok ? r.json() : null));
      }

      function openDetail() {
        document.getElementById("detail-panel").classList.add("open");
      }
      function closeDetail() {
        document.getElementById("detail-panel").classList.remove("open");
      }

      function showFile(path, content) {
        openDetail();
        document.getElementById("detail-title").textContent = path;
        const tag = document.getElementById("detail-tag");
        tag.textContent = "FILE";
        tag.className = "detail-tag file";
        const body = document.getElementById("detail-body");
        body.innerHTML = "";
        const lines = content.split("\n");
        lines.forEach((line, i) => {
          body.appendChild(codeLine(i + 1, line, "ctx"));
        });
      }

      function showDiff(path, before, after) {
        openDetail();
        document.getElementById("detail-title").textContent = path;
        const tag = document.getElementById("detail-tag");
        tag.textContent = "DIFF";
        tag.className = "detail-tag diff";
        const body = document.getElementById("detail-body");
        body.innerHTML = "";
        const rows = diffLines(before, after);
        let ln = 0;
        for (const row of rows) {
          if (row.t === "+") {
            ln++;
            body.appendChild(codeLine(ln, row.v, "add"));
          } else if (row.t === "-") {
            body.appendChild(codeLine("", row.v, "del"));
          } else {
            ln++;
            body.appendChild(codeLine(ln, row.v, "ctx"));
          }
        }
      }

      function codeLine(num, text, cls) {
        const row = document.createElement("div");
        row.className = "code-line " + cls;
        const ln = document.createElement("span");
        ln.className = "ln";
        ln.textContent = num;
        const lc = document.createElement("span");
        lc.className = "lc";
        lc.textContent = text;
        row.appendChild(ln);
        row.appendChild(lc);
        return row;
      }

      // Simple LCS-based line diff. Skips diffing for very large files.
      function diffLines(a, b) {
        const aL = a.split("\n");
        const bL = b.split("\n");
        const n = aL.length,
          m = bL.length;
        if (n > 2000 || m > 2000) {
          return bL.map((v) => ({ t: "+", v }));
        }
        const dp = Array.from({ length: n + 1 }, () =>
          new Int32Array(m + 1),
        );
        for (let i = n - 1; i >= 0; i--) {
          for (let j = m - 1; j >= 0; j--) {
            dp[i][j] =
              aL[i] === bL[j]
                ? dp[i + 1][j + 1] + 1
                : Math.max(dp[i + 1][j], dp[i][j + 1]);
          }
        }
        const out = [];
        let i = 0,
          j = 0;
        while (i < n && j < m) {
          if (aL[i] === bL[j]) {
            out.push({ t: " ", v: aL[i] });
            i++;
            j++;
          } else if (dp[i + 1][j] >= dp[i][j + 1]) {
            out.push({ t: "-", v: aL[i] });
            i++;
          } else {
            out.push({ t: "+", v: bL[j] });
            j++;
          }
        }
        while (i < n) out.push({ t: "-", v: aL[i++] });
        while (j < m) out.push({ t: "+", v: bL[j++] });
        return out;
      }

      function markEdited(path) {
        document.querySelectorAll(".file-item").forEach((el) => {
          if (el.title === path) el.classList.add("edited");
        });
      }

      // ── Bubbles & streaming ──────────────────────────
      function renderMarkdown(content) {
        let html = escapeHtml(content);
        html = html.replace(
          /```(\w*)\n([\s\S]*?)```/g,
          '<pre style="background:var(--bg);padding:10px;border-radius:6px;margin:8px 0;overflow-x:auto;font-family:var(--mono);font-size:12px;">$2</pre>',
        );
        html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
        html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        return html;
      }

      function addBubble(role, content) {
        const chat = document.getElementById("chat");
        const msg = document.createElement("div");
        msg.className = `message ${role}`;
        msg.innerHTML = `<div class="msg-bubble">${renderMarkdown(content)}</div>`;
        chat.appendChild(msg);
        scrollBottom();
      }

      // Reveal the assistant response progressively for a streaming feel.
      function streamBubble(content) {
        const chat = document.getElementById("chat");
        const msg = document.createElement("div");
        msg.className = "message assistant";
        const bubble = document.createElement("div");
        bubble.className = "msg-bubble";
        const caret = document.createElement("span");
        caret.className = "caret";
        bubble.appendChild(caret);
        msg.appendChild(bubble);
        chat.appendChild(msg);
        scrollBottom();

        const text = content || "";
        // Reveal in steps; cap total time for long responses.
        const steps = Math.min(text.length, 240);
        const chunk = Math.max(1, Math.ceil(text.length / steps));
        let i = 0;
        const timer = setInterval(() => {
          i = Math.min(text.length, i + chunk);
          bubble.innerHTML = renderMarkdown(text.slice(0, i));
          if (i < text.length) {
            const c = document.createElement("span");
            c.className = "caret";
            bubble.appendChild(c);
          }
          scrollBottom();
          if (i >= text.length) clearInterval(timer);
        }, 12);
      }

      function addToolCard(data) {
        const chat = document.getElementById("chat");
        const id =
          "tool-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6);
        const card = document.createElement("div");
        card.className = "tool-card" + (data.denied ? " denied" : "");

        const argsStr = fmtArgs(data.args);
        const icon = data.denied ? "✕" : "⚡";
        const time = data.denied ? "denied" : (data.tool_elapsed || 0) + "s";
        card.innerHTML = `
    <div class="tool-header" onclick="toggleTool('${id}')">
      <div class="tool-icon">${icon}</div>
      <span class="tool-name">${escapeHtml(data.tool)}</span>
      <span class="tool-args">${escapeHtml(argsStr)}</span>
      <span class="tool-time">${time}</span>
      <span class="tool-chevron" id="chev-${id}">▸</span>
    </div>
    <div class="tool-result" id="${id}">${escapeHtml(data.result)}</div>
  `;
        chat.appendChild(card);
        scrollBottom();
      }

      function toggleTool(id) {
        const el = document.getElementById(id);
        const chev = document.getElementById("chev-" + id);
        el.classList.toggle("show");
        chev.classList.toggle("open");
      }

      // ── Typing indicator ─────────────────────────────
      function showTyping() {
        removeTyping();
        const chat = document.getElementById("chat");
        const t = document.createElement("div");
        t.className = "typing";
        t.id = "typing";
        t.innerHTML =
          '<div class="typing-dots"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
        chat.appendChild(t);
        scrollBottom();
      }
      function removeTyping() {
        const t = document.getElementById("typing");
        if (t) t.remove();
      }

      // ── Controls ─────────────────────────────────────
      function stopAgent() {
        fetch("/api/stop", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ conversation_id: conversationId }),
        }).catch((e) => console.error(e));
      }

      async function resetChat() {
        if (sending) return;
        editedFiles.clear();
        try {
          const res = await fetch("/api/conversations", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ workspace: workspace }),
          });
          const data = await res.json();
          conversationId = data.id;
          document.getElementById("chat").innerHTML = WELCOME_HTML;
          document.getElementById("tokens").textContent = "0";
          closeDetail();
          await loadConversations();
        } catch (e) {
          console.error(e);
        }
      }

      function useSuggestion(el) {
        document.getElementById("user-input").value = el.textContent;
        sendMessage();
      }

      function handleKey(e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      }

      function autoGrow(el) {
        el.style.height = "42px";
        el.style.height = Math.min(el.scrollHeight, 150) + "px";
      }

      function updateTokens(tokens) {
        if (tokens?.total)
          document.getElementById("tokens").textContent =
            tokens.total.toLocaleString();
      }

      function scrollBottom() {
        const chat = document.getElementById("chat");
        chat.scrollTop = chat.scrollHeight;
      }

      function fmtArgs(args) {
        if (!args) return "";
        const e = Object.entries(args);
        if (!e.length) return "";
        return e
          .map(([k, v]) => {
            const s = String(v);
            return s.length > 30 ? s.slice(0, 30) + "…" : s;
          })
          .join(", ");
      }

      function fmtArgsFull(args) {
        if (!args || !Object.keys(args).length) return "(no arguments)";
        return Object.entries(args)
          .map(([k, v]) => {
            let s = typeof v === "string" ? v : JSON.stringify(v, null, 2);
            if (s.length > 2000) s = s.slice(0, 2000) + "\n… (truncated)";
            return `${k}: ${s}`;
          })
          .join("\n");
      }

      function escapeHtml(text) {
        const d = document.createElement("div");
        d.textContent = text == null ? "" : String(text);
        return d.innerHTML;
      }

      function finishSend() {
        sending = false;
        document.getElementById("send-btn").disabled = false;
        document.getElementById("stop-btn").classList.remove("show");
        removeTyping();
        document.getElementById("user-input").focus();
        if (conversationId) loadConversations();
      }

      // ── Load workspace ───────────────────────────────
      function loadWorkspace() {
        fetch("/api/workspace")
          .then((r) => r.json())
          .then((data) => {
            workspace = data.workspace;
            document.getElementById("ws-path").textContent = data.workspace;
            document.getElementById("file-count").textContent =
              `${data.total_files} files`;
            const tree = document.getElementById("file-tree");
            tree.innerHTML = "";
            const groups = {};
            data.files.forEach((f) => {
              const parts = f.split(/[\/\\]/);
              const dir = parts.length > 1 ? parts[0] : "";
              if (!groups[dir]) groups[dir] = [];
              groups[dir].push(f);
            });
            for (const dir of Object.keys(groups).sort()) {
              if (dir) {
                const d = document.createElement("div");
                d.className = "file-item dir";
                d.textContent = `▸ ${dir}/`;
                tree.appendChild(d);
              }
              const files = groups[dir].slice(0, dir ? 8 : 12);
              for (const f of files) {
                const el = document.createElement("div");
                el.className = "file-item";
                if (editedFiles.has(f)) el.classList.add("edited");
                const name = dir ? f.slice(dir.length + 1) : f;
                el.textContent = dir ? `  ${name}` : name;
                el.title = f;
                el.onclick = () => openFile(f, el);
                tree.appendChild(el);
              }
              if (groups[dir].length > files.length) {
                const m = document.createElement("div");
                m.className = "file-item";
                m.style.color = "var(--text-muted)";
                m.style.cursor = "default";
                m.textContent = `  … ${groups[dir].length - files.length} more`;
                tree.appendChild(m);
              }
            }
          });
      }

      function openFile(path, el) {
        document
          .querySelectorAll(".file-item.active")
          .forEach((x) => x.classList.remove("active"));
        if (el) el.classList.add("active");
        fetchFile(path)
          .then((res) => {
            if (res && res.content != null) showFile(path, res.content);
            else showFile(path, "(could not load file)");
          })
          .catch(() => showFile(path, "(could not load file)"));
      }

      function relativeTime(iso) {
        if (!iso) return "";
        const diff = Date.now() - new Date(iso).getTime();
        const mins = Math.floor(diff / 60000);
        if (mins < 1) return "just now";
        if (mins < 60) return mins + "m ago";
        const hrs = Math.floor(mins / 60);
        if (hrs < 24) return hrs + "h ago";
        const days = Math.floor(hrs / 24);
        return days + "d ago";
      }

      async function loadConversations() {
        const res = await fetch(
          "/api/conversations?workspace=" + encodeURIComponent(workspace),
        );
        const data = await res.json();
        const list = document.getElementById("conv-list");
        list.innerHTML = "";
        for (const conv of data.conversations || []) {
          const el = document.createElement("div");
          el.className =
            "conv-item" + (conv.id === conversationId ? " active" : "");
          el.innerHTML = `
            <div class="conv-body">
              <div class="conv-title">${escapeHtml(conv.title || "New chat")}</div>
              <div class="conv-time">${relativeTime(conv.updated_at)}</div>
            </div>
            <button class="conv-delete" title="Delete this conversation" aria-label="Delete this conversation">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
              </svg>
            </button>
          `;
          el.querySelector(".conv-body").onclick = () =>
            switchConversation(conv.id);
          el.querySelector(".conv-delete").onclick = (e) => {
            e.stopPropagation();
            deleteConversation(conv.id, conv.title || "New chat");
          };
          list.appendChild(el);
        }
      }

      async function deleteConversation(id, title) {
        if (sending) return;
        const label = title || "this chat";
        if (!confirm(`Delete "${label}"? This cannot be undone.`)) return;

        try {
          const res = await fetch(
            "/api/conversations/" +
              encodeURIComponent(id) +
              "?workspace=" +
              encodeURIComponent(workspace),
            { method: "DELETE" },
          );
          if (!res.ok) {
            alert("Failed to delete conversation.");
            return;
          }

          if (id === conversationId) {
            const listRes = await fetch(
              "/api/conversations?workspace=" + encodeURIComponent(workspace),
            );
            const { conversations } = await listRes.json();
            if (conversations && conversations.length > 0) {
              conversationId = conversations[0].id;
              await loadConversations();
              await hydrateConversation(conversationId);
            } else {
              const created = await fetch("/api/conversations", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ workspace: workspace }),
              }).then((r) => r.json());
              conversationId = created.id;
              document.getElementById("chat").innerHTML = WELCOME_HTML;
              document.getElementById("tokens").textContent = "0";
              closeDetail();
              await loadConversations();
            }
          } else {
            await loadConversations();
          }
        } catch (e) {
          console.error(e);
          alert("Failed to delete conversation.");
        }
      }

      function deleteCurrentChat() {
        if (!conversationId) return;
        const active = document.querySelector(".conv-item.active .conv-title");
        const title = active ? active.textContent : "this chat";
        deleteConversation(conversationId, title);
      }

      async function switchConversation(id) {
        if (sending || id === conversationId) return;
        conversationId = id;
        closeDetail();
        await loadConversations();
        await hydrateConversation(id);
      }

      async function hydrateConversation(id) {
        const res = await fetch(
          "/api/conversations/" +
            encodeURIComponent(id) +
            "?workspace=" +
            encodeURIComponent(workspace),
        );
        if (!res.ok) {
          document.getElementById("chat").innerHTML = WELCOME_HTML;
          return;
        }
        const data = await res.json();
        const chat = document.getElementById("chat");
        chat.innerHTML = "";
        const transcript = data.transcript || [];
        if (!transcript.length) {
          chat.innerHTML = WELCOME_HTML;
          return;
        }
        for (const ev of transcript) {
          replayEvent(ev);
        }
        scrollBottom();
      }

      function replayEvent(data) {
        if (data.type === "user") {
          addBubble("user", data.content);
        } else if (data.type === "response") {
          addBubble("assistant", data.content);
        } else if (data.type === "tool_call") {
          addToolCard(data);
        } else if (data.type === "thinking") {
          const el = document.createElement("div");
          el.className = "thinking-msg";
          el.textContent = data.content;
          document.getElementById("chat").appendChild(el);
        } else if (data.type === "rag") {
          const el = document.createElement("div");
          el.className = "rag-msg";
          el.textContent = "◆ " + data.info;
          document.getElementById("chat").appendChild(el);
        } else if (data.type === "stopped") {
          const el = document.createElement("div");
          el.className = "stopped-msg";
          el.textContent = "■ Stopped by you";
          document.getElementById("chat").appendChild(el);
        } else if (data.type === "error") {
          const errMsg = document.createElement("div");
          errMsg.className = "message assistant";
          errMsg.innerHTML = `<div class="msg-bubble" style="border-color:var(--red);background:var(--red-light);color:var(--red);">
            ${escapeHtml(data.message || "An error occurred")}
          </div>`;
          document.getElementById("chat").appendChild(errMsg);
        }
      }

      async function initConversation() {
        const created = await fetch("/api/conversations", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ workspace: workspace }),
        }).then((r) => r.json());
        conversationId = created.id;
        await loadConversations();
        document.getElementById("chat").innerHTML = WELCOME_HTML;
      }

      window.addEventListener("DOMContentLoaded", async () => {
        await loadWorkspace();
        await initConversation();
        setInterval(() => {
          if (sending) loadWorkspace();
        }, 10000);
      });
    </script>
  </body>
</html>
